openapi: 3.0.3
info:
  title: My Store - Provider API
  version: 0.1.0
  description: |
    OpenAPI contract for the Store Provider HTTP API.

servers:
  - url: http://localhost:8080/v1

tags:
  - name: Health
    description: Healthcheck
  - name: Apps
    description: CRUD for Apps

paths:
  /health:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: ok
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'

  /apps:
    get:
      tags: [Apps]
      summary: List apps
      operationId: listApps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/AppResponse'
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'
    post:
      tags: [Apps]
      summary: Create app
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/CreateAppRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AppResponse'
        '400':
          $ref: './schemas.yaml#/components/responses/BadRequest'
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'

  /apps/{id}:
    parameters:
      - $ref: './schemas.yaml#/components/parameters/AppId'
    get:
      tags: [Apps]
      summary: Get app by id
      operationId: getApp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AppResponse'
        '400':
          $ref: './schemas.yaml#/components/responses/BadRequest'
        '404':
          $ref: './schemas.yaml#/components/responses/NotFound'
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'

    patch:
      tags: [Apps]
      summary: Patch app
      operationId: patchApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/PatchAppRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AppResponse'
        '400':
          $ref: './schemas.yaml#/components/responses/BadRequest'
        '404':
          $ref: './schemas.yaml#/components/responses/NotFound'
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'

    delete:
      tags: [Apps]
      summary: Delete app
      operationId: deleteApp
      responses:
        '204':
          description: No Content
        '400':
          $ref: './schemas.yaml#/components/responses/BadRequest'
        '500':
          $ref: './schemas.yaml#/components/responses/InternalError'
